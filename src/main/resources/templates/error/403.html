<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: adminPage('Access Restricted', ~{::section})}">
<section class="max-w-xl mx-auto py-12">
    <div class="bg-white rounded-[2rem] border border-sand p-8 sm:p-10 text-center shadow-xs space-y-5">
        <div class="w-16 h-16 mx-auto rounded-full bg-red-50 border border-red-200 text-red-700 flex items-center justify-center font-display text-2xl font-bold">
            403
        </div>
        <div class="space-y-2">
            <p class="text-xs uppercase tracking-[0.2em] text-terracotta font-semibold">Access Denied</p>
            <h2 class="font-display text-3xl font-semibold text-espresso">Permission required for this area</h2>
            <p class="text-sm text-slatewarm leading-relaxed">
                Your staff role
                <strong th:if="${currentStaff != null}" class="text-espresso" th:text="'(' + ${currentStaff.roleLabel()} + ')'">(Staff)</strong>
                does not have permission to open
                <code class="font-mono text-xs bg-linen px-2 py-0.5 rounded" th:text="${deniedPath ?: 'this route'}">/admin/...</code>.
            </p>
        </div>
        <div class="flex flex-wrap justify-center gap-3 pt-2">
            <a th:href="@{/admin}" class="rounded-full bg-forest hover:bg-forest-soft text-white text-xs font-semibold px-6 py-3">
                Return to Dashboard
            </a>
            <a th:href="@{/admin/account}" class="rounded-full border border-sand bg-alabaster text-espresso text-xs font-semibold px-5 py-3">
                Account &amp; Security
            </a>
        </div>
    </div>
</section>
</html>
