<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page('Something Went Wrong', 'Unexpected error on Ilonggo Bistro.', ~{::section})}">
<section class="max-w-xl mx-auto px-4 py-24 text-center space-y-5">
    <p class="text-xs uppercase tracking-[0.2em] text-terracotta font-semibold">500</p>
    <h1 class="font-display text-4xl font-semibold text-espresso">Something went wrong in the kitchen</h1>
    <p class="text-sm text-slatewarm" th:text="${errorMessage ?: 'Please refresh in a moment or return to the homepage.'}">Please refresh in a moment or return to the homepage.</p>
    <a th:href="@{/}" class="inline-block rounded-full bg-terracotta text-white text-sm font-semibold px-6 py-3">Return Home</a>
</section>
</html>
