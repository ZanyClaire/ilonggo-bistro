<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page('Track Order ' + ${order.receiptNumber}, 'Live order and rider delivery tracking for your Ilonggo Bistro order.', ~{::section})}">
<section class="max-w-4xl mx-auto px-4 sm:px-6 pt-12 space-y-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Order Header -->
    <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
            <p class="text-xs uppercase tracking-[0.18em] text-terracotta font-semibold">Order Confirmation &amp; Live Tracking</p>
            <h1 class="font-display text-3xl sm:text-4xl font-semibold text-espresso mt-1">
                Order <span class="font-mono text-forest" th:text="${order.receiptNumber}">OR-2026</span>
            </h1>
            <p class="text-xs text-slatewarm mt-1">
                Placed by <strong class="text-espresso" th:text="${order.customerName}">Guest</strong> ·
                <span th:text="${order.formattedCreatedAt()}">Date</span>
            </p>
        </div>
        <a th:href="@{/order}" class="rounded-full border border-sand bg-white hover:border-terracotta text-espresso text-xs font-semibold px-5 py-2.5">
            + Order Again
        </a>
    </div>

    <!-- Live Auto-Polling HTMX Delivery Tracker Fragment -->
    <div th:replace="~{fragments/delivery-status :: tracker}"></div>

    <!-- Pickup-to-Dropoff Route Map & Order Breakdown -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <div th:if="${delivery != null}" id="live-map" class="lg:col-span-7 bg-white rounded-3xl border border-sand overflow-hidden shadow-xs">
            <div class="px-5 py-3.5 border-b border-sand flex items-center justify-between text-xs">
                <strong class="text-espresso">Delivery Route (<span th:text="${delivery.distanceKm}">2.4</span> km)</strong>
                <span class="text-slatewarm" th:text="${delivery.dropoffAddress}">Address</span>
            </div>
            <div id="tracking-map" class="w-full h-72 z-0"></div>
            <div th:if="${delivery.dropoffLandmark != null and !delivery.dropoffLandmark.isBlank()}"
                 class="px-5 py-3 bg-alabaster border-t border-sand text-xs text-slatewarm">
                <strong>Landmark:</strong> <span th:text="${delivery.dropoffLandmark}">Landmark</span>
            </div>
        </div>

        <div th:classappend="${delivery != null} ? 'lg:col-span-5' : 'lg:col-span-12'"
             class="bg-white rounded-3xl border border-sand p-6 space-y-4 shadow-xs">
            <h3 class="font-display text-xl font-semibold text-espresso">Order Summary</h3>
            <ul class="divide-y divide-sand text-sm">
                <li th:each="line : ${order.items}" class="py-2.5 flex justify-between gap-3">
                    <span th:text="${line.quantity} + ' × ' + ${line.itemName}">1 × Dish</span>
                    <span class="font-semibold tabular-nums" th:text="${line.formattedLineTotal()}">₱195.00</span>
                </li>
            </ul>
            <div class="pt-3 border-t border-sand space-y-1.5 text-sm tabular-nums">
                <div class="flex justify-between text-slatewarm text-xs">
                    <span>Subtotal</span>
                    <span th:text="${order.formattedSubtotal()}">₱0.00</span>
                </div>
                <div th:if="${order.deliveryFeePhp.signum() > 0}" class="flex justify-between text-slatewarm text-xs">
                    <span>Delivery Fee</span>
                    <span th:text="${order.formattedDeliveryFee()}">₱0.00</span>
                </div>
                <div class="flex justify-between text-base font-display font-bold text-espresso pt-2 border-t border-sand">
                    <span>Total (<span th:text="${order.paymentStatus == 'CASH_ON_DELIVERY' ? 'COD' : 'Paid'}">COD</span>)</span>
                    <span class="text-forest" th:text="${order.formattedTotal()}">₱0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script th:if="${delivery != null}" th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const pLat = /*[[${delivery.pickupLat}]]*/ 10.8969;
            const pLng = /*[[${delivery.pickupLng}]]*/ 122.7022;
            const dLat = /*[[${delivery.dropoffLat}]]*/ 10.8924;
            const dLng = /*[[${delivery.dropoffLng}]]*/ 122.7078;

            const tMap = L.map('tracking-map');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(tMap);
            const pickupM = L.marker([pLat, pLng]).addTo(tMap).bindPopup('<strong>Pickup:</strong> Ilonggo Bistro');
            const dropM = L.marker([dLat, dLng]).addTo(tMap).bindPopup('<strong>Drop-off:</strong> Your Location');
            const line = L.polyline([ [pLat, pLng], [dLat, dLng] ], { color: '#B84A27', weight: 4, dashArray: '8, 8' }).addTo(tMap);
            tMap.fitBounds(line.getBounds().pad(0.25));
        });
    </script>
</section>
</html>
