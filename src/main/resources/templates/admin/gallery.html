<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: adminPage('Gallery Manager', ~{::section})}">
<section class="space-y-8">
    <div class="bg-white rounded-3xl border border-sand p-6 space-y-4">
        <h2 class="font-display text-xl font-semibold text-espresso">Upload Gallery Photo</h2>
        <form th:action="@{/admin/gallery}" method="post" enctype="multipart/form-data"
              class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs font-semibold mb-1">Title</label>
                <input type="text" name="title" required placeholder="Sunday Family Lunch"
                       class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">Category</label>
                <select name="category" class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2.5 text-sm">
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Food & Drink</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">Caption</label>
                <input type="text" name="caption" placeholder="Short caption..."
                       class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">Photo File (JPG/PNG/WEBP)</label>
                <input type="file" name="file" accept="image/jpeg,image/png,image/webp" required
                       class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2 text-xs">
            </div>
            <div class="lg:col-span-4 flex justify-end">
                <button type="submit" class="rounded-full bg-terracotta text-white text-xs font-semibold px-6 py-2.5 cursor-pointer">
                    + Upload Photo
                </button>
            </div>
        </form>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <div th:each="photo : ${photos}" class="bg-white rounded-2xl border border-sand overflow-hidden">
            <img th:src="${photo.imageUrl}" th:alt="${photo.title}" class="w-full aspect-[4/3] object-cover">
            <div class="p-4 space-y-2">
                <div class="flex items-center justify-between gap-2">
                    <span class="text-xs font-semibold text-terracotta" th:text="${photo.category}">Vibe</span>
                    <span class="text-xs font-semibold" th:text="${photo.visible ? 'Visible' : 'Hidden'}">Visible</span>
                </div>
                <div class="font-display font-semibold text-espresso" th:text="${photo.title}">Title</div>
                <div class="flex items-center gap-3 pt-2 border-t border-sand text-xs">
                    <form th:action="@{/admin/gallery/{id}/toggle(id=${photo.id})}" method="post">
                        <button type="submit" class="font-semibold text-forest hover:underline cursor-pointer"
                                th:text="${photo.visible ? 'Hide' : 'Show'}">Hide</button>
                    </form>
                    <form th:action="@{/admin/gallery/{id}/delete(id=${photo.id})}" method="post" onsubmit="return confirm('Delete photo?');">
                        <button type="submit" class="font-semibold text-red-700 hover:underline cursor-pointer">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
