<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Reset Staff Password — ' + ${storeProfile.bistroName()}">Reset Password — Ilonggo Bistro</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-alabaster text-espresso min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-lg bg-white rounded-[2rem] border border-sand p-8 sm:p-10 shadow-sm space-y-6">
    <div class="text-center space-y-2">
        <img th:src="@{/images/logo.jpg}" th:alt="${storeProfile.bistroName()} + ' Logo'"
             class="w-18 h-18 mx-auto rounded-full object-cover ring-4 ring-forest/15">
        <h1 class="font-display text-3xl font-semibold text-espresso">Reset Staff Password</h1>
        <p class="text-xs text-slatewarm">Verify via 6-digit OTP sent to your registered Gmail or WhatsApp number.</p>
    </div>

    <div th:if="${otpSentMessage}" class="rounded-2xl bg-emerald-50 border border-emerald-200 px-4 py-3 text-xs text-emerald-900 font-medium"
         th:text="${otpSentMessage}">Sent!</div>
    <div th:if="${devOtpPreview}" class="rounded-2xl bg-amber-50 border-2 border-amber-300 px-4 py-3 text-xs text-amber-950 font-mono font-bold"
         th:text="${devOtpPreview}">DEV OTP</div>
    <div th:if="${resetError}" class="rounded-2xl bg-red-50 border border-red-200 px-4 py-3 text-xs text-red-900 font-medium"
         th:text="${resetError}">Error</div>

    <!-- Step 1: Request 6-Digit OTP -->
    <form th:action="@{/admin/forgot-password/request}" method="post"
          class="rounded-2xl bg-alabaster border border-sand p-5 space-y-4">
        <p class="text-xs font-bold uppercase tracking-wider text-forest">Step 1 · Request Verification Code</p>
        <div>
            <label for="req-identifier" class="block text-xs font-semibold text-espresso mb-1">Registered Gmail or WhatsApp Number</label>
            <input id="req-identifier" name="identifier" type="text" required th:value="${resetIdentifier}"
                   placeholder="ilonggobistro.admin@gmail.com or +63 917 800 2025"
                   class="w-full rounded-xl bg-white border border-sand px-3.5 py-2.5 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-2.5">
            <button type="submit" name="channel" value="GMAIL"
                    class="rounded-full bg-forest hover:bg-forest-soft text-white text-xs font-semibold py-2.5 px-4 cursor-pointer">
                Send OTP via Gmail
            </button>
            <button type="submit" name="channel" value="WHATSAPP"
                    class="rounded-full bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold py-2.5 px-4 cursor-pointer">
                Send OTP via WhatsApp
            </button>
        </div>
    </form>

    <!-- Step 2: Verify OTP & Set New Password -->
    <form th:action="@{/admin/forgot-password/confirm}" method="post" class="space-y-4">
        <p class="text-xs font-bold uppercase tracking-wider text-terracotta">Step 2 · Verify OTP &amp; Set New Password</p>
        <div>
            <label for="conf-identifier" class="block text-xs font-semibold text-espresso mb-1">Registered Gmail or WhatsApp Number</label>
            <input id="conf-identifier" name="identifier" type="text" required th:value="${resetIdentifier}"
                   placeholder="Same Gmail or phone number used in Step 1"
                   class="w-full rounded-xl bg-alabaster border border-sand px-3.5 py-2.5 text-sm">
        </div>
        <div>
            <label for="otpCode" class="block text-xs font-semibold text-espresso mb-1">6-Digit OTP Code</label>
            <input id="otpCode" name="otpCode" type="text" inputmode="numeric" maxlength="6" pattern="\d{6}" required
                   placeholder="123456"
                   class="w-full rounded-xl bg-alabaster border border-sand px-3.5 py-2.5 text-sm font-mono tracking-widest">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label for="newPassword" class="block text-xs font-semibold text-espresso mb-1">New Password (8+ chars)</label>
                <input id="newPassword" name="newPassword" type="password" minlength="8" required
                       class="w-full rounded-xl bg-alabaster border border-sand px-3.5 py-2.5 text-sm">
            </div>
            <div>
                <label for="confirmPassword" class="block text-xs font-semibold text-espresso mb-1">Confirm New Password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required
                       class="w-full rounded-xl bg-alabaster border border-sand px-3.5 py-2.5 text-sm">
            </div>
        </div>
        <button type="submit"
                class="w-full rounded-full bg-terracotta hover:bg-terracotta-dark text-white font-semibold py-3.5 text-sm cursor-pointer">
            Verify OTP &amp; Save New Password
        </button>
    </form>

    <div class="text-center pt-1">
        <a th:href="@{/admin/login}" class="text-xs text-slatewarm hover:text-terracotta">← Back to Staff Sign In</a>
    </div>
</div>
</body>
</html>
