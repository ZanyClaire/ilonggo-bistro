<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/admin-layout :: adminPage('Kitchen Queue (KDS)', ~{::section})}">
<section class="space-y-5">
    <!-- Top Live Control Toolbar -->
    <div class="bg-white rounded-3xl border border-sand p-4 sm:p-5 shadow-xs flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div class="space-y-1">
            <div class="flex flex-wrap items-center gap-2.5">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-bold">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Live Queue · Auto-Refresh 5s
                </span>
                <span class="text-xs text-slatewarm tabular-nums">
                    Updated <strong id="kds-last-sync" class="text-espresso" th:text="${board.formattedSnapshotTime()}">now</strong>
                </span>
                <span id="kds-new-order-toast"
                      class="hidden px-3 py-1 rounded-full bg-terracotta text-white text-xs font-bold animate-bounce">
                    New Order Arrived!
                </span>
            </div>
            <p class="text-xs text-slatewarm">
                Oldest tickets appear first (FIFO). Tap a ticket button to advance from <strong>Up Next</strong> → <strong>Cooking</strong> → <strong>Ready</strong> → <strong>Served</strong>.
            </p>
        </div>

        <div class="flex flex-wrap items-center gap-2.5">
            <!-- Web Audio API New Order Ding Toggle -->
            <button id="kds-sound-toggle" type="button" onclick="kdsToggleSound()"
                    class="inline-flex items-center gap-2 rounded-full border border-sand bg-alabaster hover:border-forest px-4 py-2 text-xs font-semibold text-espresso transition-colors cursor-pointer">
                <span id="kds-sound-icon" aria-hidden="true">🔕</span>
                <span id="kds-sound-label">New Order Ding: OFF</span>
            </button>

            <!-- Manual Refresh Button -->
            <button type="button" onclick="kdsManualRefresh()"
                    class="inline-flex items-center gap-1.5 rounded-full bg-forest hover:bg-forest-soft text-white px-4 py-2 text-xs font-semibold transition-colors cursor-pointer">
                <span>↻</span>
                <span>Refresh Now</span>
            </button>
        </div>
    </div>

    <!-- Tablet / Mobile Column Filter Tabs (hidden on xl 3-column screens) -->
    <div class="xl:hidden flex flex-wrap gap-2" role="tablist" aria-label="Kitchen Queue Columns">
        <button type="button" data-kds-tab="ALL" onclick="kdsSetTab('ALL')"
                class="kds-tab-btn px-4 py-2 rounded-full text-xs font-bold border border-forest bg-forest text-white cursor-pointer">
            All Active
        </button>
        <button type="button" data-kds-tab="PENDING" onclick="kdsSetTab('PENDING')"
                class="kds-tab-btn px-4 py-2 rounded-full text-xs font-bold border border-sand bg-white text-espresso cursor-pointer">
            Up Next (<span id="kds-tab-pending-count" th:text="${board.pendingCount()}">0</span>)
        </button>
        <button type="button" data-kds-tab="COOKING" onclick="kdsSetTab('COOKING')"
                class="kds-tab-btn px-4 py-2 rounded-full text-xs font-bold border border-sand bg-white text-espresso cursor-pointer">
            In Progress (<span id="kds-tab-cooking-count" th:text="${board.cookingCount()}">0</span>)
        </button>
        <button type="button" data-kds-tab="READY" onclick="kdsSetTab('READY')"
                class="kds-tab-btn px-4 py-2 rounded-full text-xs font-bold border border-sand bg-white text-espresso cursor-pointer">
            Ready (<span id="kds-tab-ready-count" th:text="${board.readyCount()}">0</span>)
        </button>
    </div>

    <!-- Live HTMX Polling Board Container (preserves scroll position via show:none) -->
    <div id="kds-board-poll"
         hx-get="/admin/kitchen/board"
         hx-trigger="every 5s, refreshKds from:body"
         hx-swap="innerHTML show:none">
        <div th:replace="~{admin/fragments/kitchen-board :: board}"></div>
    </div>

    <script>
        (function () {
            const SOUND_KEY = 'ilonggo_kds_sound_enabled';
            const TAB_KEY = 'ilonggo_kds_active_tab';
            let audioCtx = null;
            let seenPendingIds = new Set();
            let initialized = false;
            let servedDrawerOpen = false;
            let activeTab = sessionStorage.getItem(TAB_KEY) || 'ALL';

            function isSoundEnabled() {
                return localStorage.getItem(SOUND_KEY) === 'true';
            }

            function ensureAudioContext() {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                if (!audioCtx) {
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                return audioCtx;
            }

            function playKitchenDing() {
                const ctx = ensureAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;

                // Dual-tone kitchen service bell (A5 -> D6)
                const notes = [880.0, 1174.66];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.14);

                    gain.gain.setValueAtTime(0.0001, now + idx * 0.14);
                    gain.gain.exponentialRampToValueAtTime(0.28, now + idx * 0.14 + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 0.45);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.14);
                    osc.stop(now + idx * 0.14 + 0.48);
                });
            }

            function updateSoundButtonUi() {
                const enabled = isSoundEnabled();
                const btn = document.getElementById('kds-sound-toggle');
                const icon = document.getElementById('kds-sound-icon');
                const label = document.getElementById('kds-sound-label');
                if (!btn || !icon || !label) return;
                icon.textContent = enabled ? '🔔' : '🔕';
                label.textContent = enabled ? 'New Order Ding: ON' : 'New Order Ding: OFF';
                if (enabled) {
                    btn.className = 'inline-flex items-center gap-2 rounded-full border border-terracotta bg-terracotta/10 px-4 py-2 text-xs font-bold text-terracotta transition-colors cursor-pointer';
                } else {
                    btn.className = 'inline-flex items-center gap-2 rounded-full border border-sand bg-alabaster hover:border-forest px-4 py-2 text-xs font-semibold text-espresso transition-colors cursor-pointer';
                }
            }

            window.kdsToggleSound = function () {
                const next = !isSoundEnabled();
                localStorage.setItem(SOUND_KEY, next ? 'true' : 'false');
                updateSoundButtonUi();
                if (next) {
                    playKitchenDing();
                }
            };

            window.kdsManualRefresh = function () {
                if (window.htmx) {
                    window.htmx.trigger(document.body, 'refreshKds');
                } else {
                    window.location.reload();
                }
            };

            function applyColumnFilter() {
                const isDesktopThreeCol = window.innerWidth >= 1280;
                document.querySelectorAll('[data-kds-col]').forEach((col) => {
                    const colKey = col.getAttribute('data-kds-col');
                    if (isDesktopThreeCol || activeTab === 'ALL' || activeTab === colKey) {
                        col.classList.remove('hidden');
                    } else {
                        col.classList.add('hidden');
                    }
                });

                document.querySelectorAll('.kds-tab-btn').forEach((btn) => {
                    const tabKey = btn.getAttribute('data-kds-tab');
                    if (tabKey === activeTab) {
                        btn.className = 'kds-tab-btn px-4 py-2 rounded-full text-xs font-bold border border-forest bg-forest text-white cursor-pointer';
                    } else {
                        btn.className = 'kds-tab-btn px-4 py-2 rounded-full text-xs font-bold border border-sand bg-white text-espresso cursor-pointer';
                    }
                });
            }

            window.kdsSetTab = function (tab) {
                activeTab = tab;
                sessionStorage.setItem(TAB_KEY, tab);
                applyColumnFilter();
            };

            function bindServedDrawer() {
                const drawer = document.getElementById('kds-served-drawer');
                if (!drawer) return;
                drawer.open = servedDrawerOpen;
                drawer.addEventListener('toggle', () => {
                    servedDrawerOpen = drawer.open;
                });
            }

            function syncBoardState(isSwap) {
                const boardEl = document.getElementById('kds-board-content');
                if (!boardEl) return;

                const syncedAt = boardEl.getAttribute('data-synced-at') || '';
                const syncClockEl = document.getElementById('kds-last-sync');
                if (syncClockEl && syncedAt) syncClockEl.textContent = syncedAt;

                const pendingCount = parseInt(boardEl.getAttribute('data-pending-count') || '0', 10);
                const cookingCount = parseInt(boardEl.getAttribute('data-cooking-count') || '0', 10);
                const readyCount = parseInt(boardEl.getAttribute('data-ready-count') || '0', 10);

                const tabPending = document.getElementById('kds-tab-pending-count');
                const tabCooking = document.getElementById('kds-tab-cooking-count');
                const tabReady = document.getElementById('kds-tab-ready-count');
                if (tabPending) tabPending.textContent = String(pendingCount);
                if (tabCooking) tabCooking.textContent = String(cookingCount);
                if (tabReady) tabReady.textContent = String(readyCount);

                const sidebarBadge = document.getElementById('sidebar-kds-badge');
                if (sidebarBadge) {
                    sidebarBadge.textContent = String(pendingCount);
                    if (pendingCount > 0) {
                        sidebarBadge.classList.remove('hidden');
                    } else {
                        sidebarBadge.classList.add('hidden');
                    }
                }

                const rawIds = (boardEl.getAttribute('data-pending-ids') || '')
                    .split(',')
                    .map((s) => s.trim())
                    .filter(Boolean);

                if (initialized && isSwap) {
                    const hasBrandNewOrder = rawIds.some((id) => !seenPendingIds.has(id));
                    if (hasBrandNewOrder) {
                        if (isSoundEnabled()) {
                            playKitchenDing();
                        }
                        const toast = document.getElementById('kds-new-order-toast');
                        if (toast) {
                            toast.classList.remove('hidden');
                            setTimeout(() => toast.classList.add('hidden'), 4500);
                        }
                    }
                }

                seenPendingIds = new Set(rawIds);
                initialized = true;
                applyColumnFilter();
                bindServedDrawer();
            }

            document.addEventListener('DOMContentLoaded', () => {
                updateSoundButtonUi();
                syncBoardState(false);
            });

            window.addEventListener('resize', applyColumnFilter);

            document.body.addEventListener('htmx:afterSwap', (evt) => {
                if (evt.detail && evt.detail.target && evt.detail.target.id === 'kds-board-poll') {
                    syncBoardState(true);
                }
            });
        })();
    </script>
</section>
</html>
