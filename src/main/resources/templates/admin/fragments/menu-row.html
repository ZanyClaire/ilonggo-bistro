<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<table>
    <tbody>
    <tr th:fragment="row" th:id="'menu-row-' + ${item.id}" class="hover:bg-alabaster/60">
        <td class="px-5 py-4">
            <div class="flex items-center gap-3">
                <img th:src="${item.effectiveImageUrl()}" th:alt="${item.name}"
                     class="w-12 h-12 rounded-xl object-cover border border-sand flex-shrink-0">
                <div>
                    <div class="font-semibold text-espresso" th:text="${item.name}">Dish Name</div>
                    <div class="text-xs text-slatewarm" th:text="${item.category.name}">Category</div>
                </div>
            </div>
        </td>
        <td class="px-5 py-4 font-semibold tabular-nums text-forest" th:text="${item.formattedPrice()}">₱195</td>
        <td class="px-5 py-4">
            <button type="button"
                    th:attr="hx-post=@{/admin/menu/{id}/toggle-availability(id=${item.id})}"
                    th:attrappend="hx-target='#menu-row-' + ${item.id}"
                    hx-swap="outerHTML"
                    th:classappend="${item.available} ? 'bg-emerald-100 text-emerald-900 border-emerald-200' : 'bg-red-100 text-red-900 border-red-200'"
                    class="px-3 py-1 rounded-full text-xs font-semibold border cursor-pointer transition-colors"
                    th:text="${item.available ? 'Available' : 'Sold Out'}">Available</button>
        </td>
        <td class="px-5 py-4">
            <button type="button"
                    th:attr="hx-post=@{/admin/menu/{id}/toggle-featured(id=${item.id})}"
                    th:attrappend="hx-target='#menu-row-' + ${item.id}"
                    hx-swap="outerHTML"
                    th:classappend="${item.featured} ? 'bg-amber-100 text-amber-900 border-amber-200' : 'bg-linen text-slatewarm border-sand'"
                    class="px-3 py-1 rounded-full text-xs font-semibold border cursor-pointer transition-colors"
                    th:text="${item.featured ? '★ Featured' : 'Standard'}">Featured</button>
        </td>
        <td class="px-5 py-4 text-right whitespace-nowrap space-x-2">
            <a th:href="@{/admin/menu/{id}/edit(id=${item.id})}"
               class="inline-block text-xs font-semibold text-forest hover:text-terracotta">Edit</a>
            <form th:action="@{/admin/menu/{id}/delete(id=${item.id})}" method="post" class="inline"
                  onsubmit="return confirm('Remove this dish from the menu?');">
                <button type="submit" class="text-xs font-semibold text-red-700 hover:underline cursor-pointer">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
