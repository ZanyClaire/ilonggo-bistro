<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: adminPage('Edit Menu Dish', ~{::section})}">
<section class="max-w-3xl bg-white rounded-3xl border border-sand p-8 space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="font-display text-2xl font-semibold text-espresso" th:text="'Edit: ' + ${editingItem.name}">Edit Dish</h2>
        <a th:href="@{/admin/menu}" class="text-xs font-semibold text-slatewarm hover:text-terracotta">← Back to Menu</a>
    </div>

    <form th:action="@{/admin/menu/{id}(id=${editingItem.id})}" th:object="${menuItemForm}" method="post" enctype="multipart/form-data" class="space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-espresso mb-1">Dish Name</label>
                <input type="text" th:field="*{name}" required class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-espresso mb-1">Category</label>
                <select th:field="*{categoryId}" required class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2.5 text-sm">
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-espresso mb-1">Price (PHP ₱)</label>
                <input type="number" step="0.01" min="1" th:field="*{pricePhp}" required class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-espresso mb-1">Badge Label</label>
                <input type="text" th:field="*{badgeLabel}" class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2.5 text-sm">
            </div>
        </div>
        <div>
            <label class="block text-xs font-semibold text-espresso mb-1">Description</label>
            <textarea th:field="*{description}" rows="3" required class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2.5 text-sm"></textarea>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-espresso mb-1">Image URL</label>
                <input type="text" th:field="*{imageUrl}" class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2.5 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-espresso mb-1">Or Upload Replacement Photo</label>
                <input type="file" name="photo" accept="image/jpeg,image/png,image/webp" class="w-full rounded-xl bg-alabaster border border-sand px-3 py-2 text-xs">
            </div>
        </div>
        <div class="flex items-center gap-6 text-sm">
            <label class="inline-flex items-center gap-2"><input type="checkbox" th:field="*{available}" class="accent-terracotta"> Available</label>
            <label class="inline-flex items-center gap-2"><input type="checkbox" th:field="*{featured}" class="accent-terracotta"> Featured on Home</label>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="rounded-full bg-terracotta hover:bg-terracotta-dark text-white text-sm font-semibold px-6 py-2.5 cursor-pointer">Save Changes</button>
            <a th:href="@{/admin/menu}" class="rounded-full border border-sand px-6 py-2.5 text-sm font-semibold text-espresso">Cancel</a>
        </div>
    </form>
</section>
</html>
