spring:
  datasource:
    url: jdbc:h2:file:./data/ilonggobistro;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

logging:
  level:
    com.ilonggobistro: DEBUG
